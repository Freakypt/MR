<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="기상 미션">
<title>기상 미션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0fa;
  --surface: #ffffff;
  --surface2: #faf7fe;
  --border: #e8e0f4;
  --text: #1e1825;
  --text-muted: #7a6e88;
  --text-faint: #b8aecb;
  --accent: #7c5cbf;
  --accent-light: #ede6ff;
  --gold: #f0b429;
  --gold-light: #fff8e6;
  --gold-dim: #d4a017;
  --success: #3d9970;
  --fail: #c0392b;
  --chat-me: #7c5cbf;
  --chat-sis: #f0eaff;
  --sans: 'Noto Sans KR', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); overflow: hidden; }

/* === LAYOUT === */
.app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }
.tab-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tab-pane { display: none; height: 100%; }
.tab-pane.active { display: flex; flex-direction: column; }

/* === BOTTOM TAB BAR === */
.tab-bar {
  display: flex; background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  flex-shrink: 0; z-index: 10;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 10px 4px 8px; background: none; border: none; cursor: pointer;
  font-family: var(--sans); transition: all 0.15s;
}
.tab-btn .tab-icon { font-size: 22px; line-height: 1; }
.tab-btn .tab-label { font-size: 10px; font-weight: 500; color: var(--text-faint); letter-spacing: 0.3px; }
.tab-btn.active .tab-label { color: var(--accent); }
.tab-btn.active .tab-icon { transform: scale(1.08); }

/* === HEADER === */
.page-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.page-title { font-size: 18px; font-weight: 700; color: var(--text); }
.page-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* =====================
   TAB 1: 대화 (CHAT)
   ===================== */
.chat-header {
  padding: 14px 18px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.chat-header-left { display: flex; align-items: center; gap: 10px; }
.sis-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #b8d4f0, #c9f0e8);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.sis-name { font-size: 15px; font-weight: 600; color: var(--text); }
.sis-status { font-size: 11px; color: var(--success); }
.mission-badge {
  background: var(--accent-light); color: var(--accent);
  font-size: 11px; font-weight: 600; padding: 4px 10px;
  border-radius: 99px; cursor: pointer; border: none; font-family: var(--sans);
  flex-shrink: 0;
}

.chat-messages {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px;
}
.msg { display: flex; align-items: flex-end; gap: 8px; }
.msg.me { flex-direction: row-reverse; }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #c9b8f0, #f0b8d4);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.msg-bubble {
  max-width: 72%; padding: 10px 13px; border-radius: 18px;
  font-size: 14px; line-height: 1.55; word-break: keep-all;
}
.msg.sis .msg-bubble {
  background: var(--chat-sis); color: var(--text);
  border-bottom-left-radius: 5px;
}
.msg.me .msg-bubble {
  background: var(--chat-me); color: #fff;
  border-bottom-right-radius: 5px;
}
.msg-time { font-size: 10px; color: var(--text-faint); margin-bottom: 3px; flex-shrink: 0; }
.msg-img { max-width: 200px; border-radius: 12px; display: block; margin-top: 6px; }
.result-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; margin-top: 6px;
}
.result-badge.ok { background: #d4f4e5; color: var(--success); }
.result-badge.fail { background: #fde8e6; color: var(--fail); }

.date-divider {
  text-align: center; font-size: 11px; color: var(--text-faint);
  position: relative; margin: 4px 0;
}
.date-divider::before, .date-divider::after {
  content: ''; position: absolute; top: 50%; width: 28%; height: 1px;
  background: var(--border);
}
.date-divider::before { left: 0; }
.date-divider::after { right: 0; }

.chat-input-area {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 14px calc(10px + var(--safe-bottom)); flex-shrink: 0;
}
.mission-status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--accent-light); border-radius: 10px;
  margin-bottom: 8px;
}
.msb-left { font-size: 12px; color: var(--accent); font-weight: 500; }
.msb-time { font-size: 12px; color: var(--text-muted); }

.input-row { display: flex; gap: 8px; align-items: flex-end; }
.upload-btn {
  width: 40px; height: 40px; border-radius: 50%; background: var(--accent-light);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.chat-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 22px; font-family: var(--sans); font-size: 14px;
  color: var(--text); background: var(--surface2); outline: none;
  resize: none; max-height: 100px; line-height: 1.4;
}
.chat-input:focus { border-color: var(--accent); }
.send-btn {
  width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.send-btn:hover { background: #6a4daa; }
.send-btn svg { color: #fff; }

/* === MISSION SETUP MODAL === */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 100; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 24px 22px calc(24px + var(--safe-bottom));
  width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px;
}
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; align-self: center; margin-bottom: 4px; }
.modal-title { font-size: 17px; font-weight: 700; }
.form-row { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
.form-input {
  padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  font-family: var(--sans); font-size: 14px; color: var(--text); background: var(--surface2); outline: none;
}
.form-input:focus { border-color: var(--accent); }
.modal-btn {
  padding: 13px; border-radius: 12px; border: none; cursor: pointer;
  font-family: var(--sans); font-size: 15px; font-weight: 600;
}
.modal-btn-primary { background: var(--accent); color: #fff; }
.modal-btn-secondary { background: var(--border); color: var(--text-muted); }

/* =====================
   TAB 2: 쿠폰북 (STARS)
   ===================== */
.coupon-scroll { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 20px; }

.star-summary {
  background: linear-gradient(135deg, #7c5cbf 0%, #a07de0 100%);
  border-radius: 16px; padding: 22px 20px; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
}
.ss-left .ss-count { font-size: 44px; font-weight: 700; line-height: 1; }
.ss-left .ss-label { font-size: 13px; opacity: 0.82; margin-top: 4px; }
.ss-right { font-size: 50px; }

.reward-bar {
  background: var(--surface); border-radius: 14px; padding: 16px 18px;
  border: 1px solid var(--border);
}
.reward-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.reward-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.reward-item:last-child { border-bottom: none; padding-bottom: 0; }
.reward-stars { color: var(--gold); font-weight: 600; }
.reward-claim {
  padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 600;
  border: none; cursor: pointer; font-family: var(--sans);
}
.reward-claim.active { background: var(--gold); color: #fff; }
.reward-claim.inactive { background: var(--border); color: var(--text-faint); cursor: default; }

.week-section { }
.week-title {
  font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.week-title .week-star { color: var(--gold); font-weight: 700; }

.stamp-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
}
.stamp {
  aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  border: 2px dashed var(--border); background: var(--surface);
  font-size: 10px; color: var(--text-faint); font-weight: 500;
  transition: all 0.2s; position: relative;
}
.stamp.filled {
  border: 2px solid var(--gold-light); background: var(--gold-light);
  border-color: var(--gold);
}
.stamp.failed {
  border: 2px solid #fde8e6; background: #fde8e6; border-color: #f5b7b1;
}
.stamp-icon { font-size: 24px; }
.stamp-day { font-size: 10px; font-weight: 600; }
.stamp.filled .stamp-day { color: var(--gold-dim); }
.stamp.failed .stamp-day { color: #c0392b; }
.week-bonus {
  margin-top: 10px; padding: 10px 14px; background: var(--gold-light);
  border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
  border: 1px solid #f0d080;
}
.week-bonus.locked { background: var(--surface2); border-color: var(--border); }
.wb-text { font-size: 13px; font-weight: 500; color: var(--gold-dim); }
.week-bonus.locked .wb-text { color: var(--text-faint); }
.wb-icon { font-size: 20px; }

.add-reward-btn {
  width: 100%; padding: 12px; border: 1.5px dashed var(--border); border-radius: 12px;
  background: none; cursor: pointer; font-family: var(--sans); font-size: 13px;
  color: var(--text-faint); transition: all 0.15s;
}
.add-reward-btn:hover { border-color: var(--accent); color: var(--accent); }

/* =====================
   TAB 3: 명언 (QUOTE)
   ===================== */
.quote-pane {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 24px 22px; gap: 20px; overflow-y: auto;
}
.quote-date {
  font-size: 12px; color: var(--text-faint); align-self: flex-start;
}
.quote-card {
  width: 100%; background: var(--surface); border-radius: 18px;
  padding: 30px 24px; box-shadow: 0 2px 16px rgba(124,92,191,0.08);
  display: flex; flex-direction: column; gap: 18px; min-height: 240px;
  justify-content: center; border: 1px solid var(--border);
}
.quote-decoration { font-size: 48px; line-height: 1; color: var(--accent); opacity: 0.18; }
.quote-text {
  font-size: 18px; font-weight: 500; line-height: 1.65; color: var(--text);
  word-break: keep-all;
}
.quote-author { font-size: 13px; color: var(--text-muted); text-align: right; }
.quote-btn {
  width: 100%; padding: 14px; border-radius: 14px; border: none;
  background: var(--accent); color: #fff; font-family: var(--sans);
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.quote-history { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.quote-history-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.quote-history-item {
  background: var(--surface); border-radius: 12px; padding: 12px 14px;
  border: 1px solid var(--border); font-size: 13px; color: var(--text-muted);
  line-height: 1.5; word-break: keep-all;
}
.quote-history-item strong { color: var(--text); display: block; margin-bottom: 2px; }

/* image analysis overlay */
.analysis-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; align-items: center; justify-content: center;
}
.analysis-overlay.open { display: flex; }
.analysis-box {
  background: var(--surface); border-radius: 18px; padding: 28px 22px;
  max-width: 320px; width: 90%; text-align: center; display: flex;
  flex-direction: column; align-items: center; gap: 14px;
}
.analysis-spinner { font-size: 36px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.analysis-text { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

/* reward modal */
.reward-modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 300; align-items: center; justify-content: center;
}
.reward-modal.open { display: flex; }
.reward-box {
  background: var(--surface); border-radius: 20px; padding: 30px 24px;
  max-width: 320px; width: 88%; text-align: center; display: flex;
  flex-direction: column; align-items: center; gap: 14px;
}
.reward-emoji { font-size: 52px; }
.reward-msg { font-size: 18px; font-weight: 700; line-height: 1.4; }
.reward-sub { font-size: 13px; color: var(--text-muted); line-height: 1.55; }
.reward-ok { width: 100%; padding: 13px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; }

/* util */
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="tab-content">

    <!-- TAB 1: CHAT -->
    <div class="tab-pane active" id="pane-chat">
      <div class="chat-header">
        <div class="chat-header-left">
          <div class="sis-avatar">🧚</div>
          <div>
            <div class="sis-name">루틴요정</div>
            <div class="sis-status">항상 응원 중 ✨</div>
          </div>
        </div>
        <button class="mission-badge" onclick="openMissionModal()">⚙ 미션 설정</button>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-input-area">
        <div class="mission-status-bar" id="missionStatusBar">
          <span class="msb-left" id="msbLabel">📌 오늘 미션 없음</span>
          <span class="msb-time" id="msbTime"></span>
        </div>
        <div class="input-row">
          <label class="upload-btn" title="사진 보내기">
            📷
            <input type="file" accept="image/*" capture="environment" id="photoInput" class="hidden" onchange="handlePhoto(event)">
          </label>
          <textarea class="chat-input" id="chatInput" placeholder="메시지 입력..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText();}"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <button class="send-btn" onclick="sendText()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: STARS/COUPON -->
    <div class="tab-pane" id="pane-stars">
      <div class="page-header">
        <div class="page-title">쿠폰북 ⭐</div>
        <div class="page-sub">미션 성공으로 별을 모아봐</div>
      </div>
      <div class="coupon-scroll">
        <div class="star-summary">
          <div class="ss-left">
            <div class="ss-count" id="totalStarsDisplay">0</div>
            <div class="ss-label">개의 별</div>
          </div>
          <div class="ss-right">🌟</div>
        </div>

        <div class="reward-bar">
          <div class="reward-title">🎁 보상 목록</div>
          <div id="rewardList"></div>
          <button class="add-reward-btn" onclick="openRewardAdd()">+ 보상 추가</button>
        </div>

        <div id="weekStamps"></div>
      </div>
    </div>

    <!-- TAB 3: QUOTE -->
    <div class="tab-pane" id="pane-quote">
      <div class="page-header">
        <div class="page-title">오늘의 명언 ✨</div>
        <div class="page-sub">하루 한 문장</div>
      </div>
      <div class="quote-pane">
        <div class="quote-date" id="quoteDate"></div>
        <div class="quote-card">
          <div class="quote-decoration">"</div>
          <div class="quote-text" id="quoteText">새로운 명언을 불러오세요.</div>
          <div class="quote-author" id="quoteAuthor"></div>
        </div>
        <button class="quote-btn" onclick="drawQuote()">✨ 오늘의 명언 뽑기</button>
        <div class="quote-history" id="quoteHistory"></div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="chat" onclick="switchTab('chat',this)">
      <span class="tab-icon">💬</span>
      <span class="tab-label">기상 미션</span>
    </button>
    <button class="tab-btn" data-tab="stars" onclick="switchTab('stars',this)">
      <span class="tab-icon">⭐</span>
      <span class="tab-label">쿠폰북</span>
    </button>
    <button class="tab-btn" data-tab="quote" onclick="switchTab('quote',this)">
      <span class="tab-icon">✨</span>
      <span class="tab-label">명언</span>
    </button>
  </div>
</div>

<!-- Mission Setup Modal -->
<div class="modal-overlay" id="missionModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">⏰ 미션 설정</div>
    <div style="font-size:13px;color:var(--text-muted);line-height:1.6;background:var(--surface2);padding:12px 14px;border-radius:10px;border:1px solid var(--border);">
      🧚 미션 내용은 매일 자동으로 바뀌어!<br>목표 도착 시간만 설정해두면 돼.
    </div>
    <div class="form-row">
      <div class="form-label">목표 도착 시간</div>
      <input type="time" class="form-input" id="missionTime" value="09:00">
    </div>
    <button class="modal-btn modal-btn-primary" onclick="saveMission()">저장하기</button>
    <button class="modal-btn modal-btn-secondary" onclick="closeMissionModal()">취소</button>
  </div>
</div>

<!-- Reward Add Modal -->
<div class="modal-overlay" id="rewardModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">🎁 보상 추가</div>
    <div class="form-row">
      <div class="form-label">보상 내용</div>
      <input type="text" class="form-input" id="rewardName" placeholder="예: 좋아하는 음식 사먹기">
    </div>
    <div class="form-row">
      <div class="form-label">필요한 별 개수</div>
      <input type="number" class="form-input" id="rewardStars" value="5" min="1" max="100">
    </div>
    <button class="modal-btn modal-btn-primary" onclick="addReward()">추가하기</button>
    <button class="modal-btn modal-btn-secondary" onclick="closeRewardModal()">취소</button>
  </div>
</div>

<!-- Analysis Overlay -->
<div class="analysis-overlay" id="analysisOverlay">
  <div class="analysis-box">
    <div class="analysis-spinner">🔍</div>
    <div class="analysis-text" id="analysisText">사진을 분석하고 있어...<br>잠깐만 기다려줘!</div>
  </div>
</div>

<!-- Reward Popup -->
<div class="reward-modal" id="rewardPopup">
  <div class="reward-box">
    <div class="reward-emoji" id="popupEmoji">🎉</div>
    <div class="reward-msg" id="popupMsg"></div>
    <div class="reward-sub" id="popupSub"></div>
    <button class="reward-ok" onclick="closeRewardPopup()">고마워! 💜</button>
  </div>
</div>

<script>
// ===== QUOTES =====
const QUOTES = [

// 날짜 기반으로 매일 같은 미션이 나오도록 (같은 날 앱 껐다 켜도 동일)
function getTodayMission() {
  const today = todayStr();
  // 저장된 오늘 미션이 있으면 그걸 씀
  if (state.dailyMissions && state.dailyMissions[today] !== undefined) {
    return MISSIONS[state.dailyMissions[today]];
  }
  // 없으면 날짜 seed로 새 미션 선택
  const seed = parseInt(today.replace(/-/g,''));
  const idx = seed % MISSIONS.length;
  if (!state.dailyMissions) state.dailyMissions = {};
  state.dailyMissions[today] = idx;
  save();
  return MISSIONS[idx];
}

// ===== UTILS =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function nowStr() {
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function weekKey(dateStr) {
  const d = new Date(dateStr);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${pad(week)}`;
}
function scrollBottom() {
  const el = document.getElementById('chatMessages');
  setTimeout(() => el.scrollTop = el.scrollHeight, 60);
}
function fmtDateKr(str) {
  const d = new Date(str);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

      div.className = 'date-divider';
      div.textContent = fmtDateKr(msg.date);

// ===== PHOTO HANDLING =====
function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const imageData = ev.target.result;
    addMsg('me', '', { imageData, date: todayStr(), time: nowStr() });
    document.getElementById('analysisOverlay').classList.add('open');
    await analyzePhoto(imageData);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

async function analyzePhoto(imageData) {
  const today = todayStr();
  const missionTime = state.mission.time || '09:00';
  const todayM = getTodayMission();
  const missionDesc = todayM.desc;

  document.getElementById('analysisText').textContent = `"${missionDesc}" 확인 중...\n잠깐만 기다려줘! 🧚`;

  try {
    const base64 = imageData.split(',')[1];
    const mediaType = imageData.match(/data:(.*?);/)[1];

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
            {
              type: 'text',
              text: `너는 '루틴요정'이야. 아침 기상 미션을 응원해주는 귀엽고 따뜻한 요정 캐릭터야. 반말로 짧고 친근하게 말해줘. 이모지 적극 활용!
미션 내용: "${missionDesc}"
힌트: "${todayM.hint}"
현재 시간: ${nowStr()} / 목표 시간: ${missionTime}

사진이 미션에 맞는지 판단해줘. 느슨하게 판단해도 돼 — 비슷하거나 관련 있으면 성공으로 봐줘.
JSON만 출력:
{
  "success": true 또는 false,
  "message": "루틴요정답게 2-3문장. 성공이면 신나게 칭찬 🎉, 실패면 따뜻하게 다시 도전 권유"
}`
            }
          ]
        }]
      })
    });

    const data = await resp.json();
    const raw = data.content.map(c => c.text || '').join('');
    const clean = raw.replace(/```json|```/g,'').trim();
    const result = JSON.parse(clean);

    document.getElementById('analysisOverlay').classList.remove('open');

    const success = result.success;
    const now = nowStr();
    const onTime = now <= missionTime;

    if (!state.dailyLog[today] || !state.dailyLog[today].success) {
      state.dailyLog[today] = { success: success && onTime, imageData, time: now };
    }

    if (success && onTime) {
      fairyMessage(result.message, { result: 'ok' });
      grantDailyStar(today);
    } else if (success && !onTime) {
      fairyMessage(`사진은 완벽한데 목표 시간 ${missionTime}을 넘겼어 😢\n${result.message}\n내일은 꼭 시간 맞춰 보내줘! 💪`, { result: 'fail' });
      state.dailyLog[today].success = false;
    } else {
      fairyMessage(result.message + "\n다시 찍어서 보내줘! 🧚", { result: 'fail' });
      state.dailyLog[today].success = false;
    }
    save();
    updateStatusBar();
    renderStars();

  } catch(err) {
    document.getElementById('analysisOverlay').classList.remove('open');
    console.error(err);
    fairyMessage("사진 분석 중에 오류가 났어 😢 다시 한번 보내줘!");
  }
}

// ===== STARS =====
function grantDailyStar(dateStr) {
  // Already counted?
  if (state.dailyLog[dateStr]?.starCounted) return;
  state.dailyLog[dateStr].starCounted = true;
  state.stars += 0; // daily stars don't directly increment; weekly bonus does
  save();

  // Check weekly bonus (Mon-Fri all success)
  checkWeeklyBonus(dateStr);

  showRewardPopup('🌟', '미션 성공!', `오늘 미션을 완료했어!\n이번 주 모든 미션 성공하면 별이 추가돼 ⭐`);
}

function checkWeeklyBonus(dateStr) {
  const d = new Date(dateStr);
  // Find Mon of this week
  const day = d.getDay(); // 0=Sun
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + mondayOffset);

  const weekDays = [];
  for (let i = 0; i < 5; i++) {
    const dd = new Date(monday);
    dd.setDate(monday.getDate() + i);
    weekDays.push(`${dd.getFullYear()}-${pad(dd.getMonth()+1)}-${pad(dd.getDate())}`);
  }

  const wk = weekKey(dateStr);
  if (state.weeklyStars[wk]) return; // already given

  const allSuccess = weekDays.every(d => state.dailyLog[d]?.success === true);
  if (allSuccess) {
    state.weeklyStars[wk] = true;
    state.stars += 1;
    save();
    setTimeout(() => {
      showRewardPopup('⭐', '주간 미션 완료!', '이번 주 월~금 미션을 모두 성공했어!\n별 1개가 쿠폰북에 추가됐어 🎉');
    }, 2000);
  }
}

function claimReward(id) {
  const r = state.rewards.find(x => x.id === id);
  if (!r || state.stars < r.stars) return;
  if (!confirm(`"${r.name}" 보상을 사용할까요? (별 ${r.stars}개 차감)`)) return;
  state.stars -= r.stars;
  save();
  renderStars();
  showRewardPopup('🎁', '보상 사용!', `"${r.name}" 보상을 사용했어!\n남은 별: ${state.stars}개`);
}

function deleteReward(id) {
  state.rewards = state.rewards.filter(x => x.id !== id);
  save(); renderRewardList();
}

function renderWeekStamps() {
  const el = document.getElementById('weekStamps');
  el.innerHTML = '';

  // Collect all weeks that have any data
  const weeksMap = {};
  Object.keys(state.dailyLog).forEach(dateStr => {
    const d = new Date(dateStr);
    if (isNaN(d)) return;
    const wk = weekKey(dateStr);
    if (!weeksMap[wk]) weeksMap[wk] = [];
    weeksMap[wk].push(dateStr);
  });

  // Also add current week
  const cw = weekKey(todayStr());
  if (!weeksMap[cw]) weeksMap[cw] = [];

  const sortedWeeks = Object.keys(weeksMap).sort().reverse().slice(0, 8);

  sortedWeeks.forEach(wk => {
    const [year, wNum] = wk.split('-W');
    // Compute Mon of this week
    const jan1 = new Date(parseInt(year), 0, 1);
    const mondayOfWeek = new Date(jan1);
    mondayOfWeek.setDate(jan1.getDate() + (parseInt(wNum)-1)*7 - jan1.getDay() + 1);
    if (mondayOfWeek.getDay() !== 1) mondayOfWeek.setDate(mondayOfWeek.getDate() - mondayOfWeek.getDay() + 1);

    const DAYS = ['월','화','수','목','금'];
    const dayNames = ['Mon','Tue','Wed','Thu','Fri'];

    const section = document.createElement('div');
    section.className = 'week-section';

    const bonusGiven = state.weeklyStars[wk];
    let allDone = true;
    let anyData = false;

    const stamps = DAYS.map((dn, i) => {
      const dd = new Date(mondayOfWeek);
      dd.setDate(mondayOfWeek.getDate() + i);
      const ds = `${dd.getFullYear()}-${pad(dd.getMonth()+1)}-${pad(dd.getDate())}`;
      const log = state.dailyLog[ds];
      const isFuture = ds > todayStr();
      if (log) anyData = true;
      if (!log?.success) allDone = false;

      let cls = 'stamp';
      let icon = '';
      if (log?.success) { cls += ' filled'; icon = '⭐'; }
      else if (log && !log.success) { cls += ' failed'; icon = '😴'; }
      else if (isFuture) icon = '…';
      else icon = '💤';

      return `<div class="${cls}">
        <span class="stamp-icon">${icon}</span>
        <span class="stamp-day">${dn}</span>
      </div>`;
    });

    const weekLabel = `${mondayOfWeek.getMonth()+1}/${mondayOfWeek.getDate()} 주`;
    section.innerHTML = `
      <div class="week-title">
        <span>${weekLabel}</span>
        ${bonusGiven ? '<span class="week-star">+1⭐ 획득!</span>' : ''}
      </div>
      <div class="stamp-grid">${stamps.join('')}</div>
      <div class="week-bonus ${bonusGiven ? '' : 'locked'}">
        <span class="wb-text">${bonusGiven ? '이번 주 별 획득 🎉' : allDone ? '별 획득 중...' : '월~금 모두 성공하면 +1⭐'}</span>
        <span class="wb-icon">${bonusGiven ? '⭐' : '🔒'}</span>
      </div>`;
    el.appendChild(section);
  });
}

// ===== REWARD MODAL =====
function openRewardAdd() { document.getElementById('rewardModal').classList.add('open'); }
function closeRewardModal() { document.getElementById('rewardModal').classList.remove('open'); }
function addReward() {
  const name = document.getElementById('rewardName').value.trim();
  const stars = parseInt(document.getElementById('rewardStars').value);
  if (!name || !stars) return;
  state.rewards.push({ id: state.nextRewardId++, name, stars });
  save(); closeRewardModal(); renderRewardList();
  document.getElementById('rewardName').value = '';
}

// ===== REWARD POPUP =====
function showRewardPopup(emoji, msg, sub) {
  document.getElementById('popupEmoji').textContent = emoji;
  document.getElementById('popupMsg').textContent = msg;
  document.getElementById('popupSub').textContent = sub;
  document.getElementById('rewardPopup').classList.add('open');
}
function closeRewardPopup() { document.getElementById('rewardPopup').classList.remove('open'); }

// ===== QUOTE =====
function renderQuote() {
  const today = todayStr();
  document.getElementById('quoteDate').textContent = fmtDateKr(today);

  if (state.todayQuoteDate === today && state.todayQuoteIdx !== null) {
    displayQuote(QUOTES[state.todayQuoteIdx]);
  } else {
    document.getElementById('quoteText').textContent = '버튼을 눌러 오늘의 명언을 받아봐! ✨';
    document.getElementById('quoteAuthor').textContent = '';
  }
  renderQuoteHistory();
}

function displayQuote(q) {
  document.getElementById('quoteText').textContent = q.text;
  document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
}

function drawQuote() {
  const today = todayStr();
  // Pick a quote not recently shown
  const recentIdxs = state.quoteHistory.slice(-5).map(h => h.idx);
  let candidates = QUOTES.map((_, i) => i).filter(i => !recentIdxs.includes(i));
  if (!candidates.length) candidates = QUOTES.map((_, i) => i);
  const idx = candidates[Math.floor(Math.random() * candidates.length)];

  state.todayQuoteIdx = idx;
  state.todayQuoteDate = today;

  // Add to history if new day or not yet added
  const lastH = state.quoteHistory[state.quoteHistory.length - 1];
  if (!lastH || lastH.date !== today) {
    state.quoteHistory.push({ date: today, idx, text: QUOTES[idx].text, author: QUOTES[idx].author });
    if (state.quoteHistory.length > 30) state.quoteHistory.shift();
  }
  save();
  displayQuote(QUOTES[idx]);
  renderQuoteHistory();
}

function renderQuoteHistory() {
  const el = document.getElementById('quoteHistory');
  const today = todayStr();
  const past = state.quoteHistory.filter(h => h.date !== today).slice(-7).reverse();
  if (!past.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="quote-history-title">지난 명언들</div>` +
    past.map(h => `<div class="quote-history-item">
      <strong>${fmtDateKr(h.date)}</strong>${h.text} — ${h.author}
    </div>`).join('');
}

// ===== INIT =====
(function init() {
  state = load();
  // First run greeting
  if (state.messages.length === 0) {
    const todayM = getTodayMission();
    const missionTime = state.mission.time || '09:00';
    addMsg('sis', `안녕! 나는 루틴요정이야 🧚✨\n아침 기상 미션 앱에 온 걸 환영해!\n\n오늘의 미션: ${todayM.desc}\n💡 힌트: ${todayM.hint}\n⏰ 목표 시간: ${missionTime}\n\n미션 내용은 매일 자동으로 바뀌어!\n📷 버튼으로 인증 사진 보내줘.\n월~금 모두 성공하면 별 1개 획득! ⭐`);
  } else {
    // 앱 열 때마다 오늘 미션 리마인드 (하루에 한 번만)
    const today = todayStr();
    const alreadyGreeted = state.messages.some(m => m.who === 'sis' && m.date === today);
    if (!alreadyGreeted && !state.dailyLog[today]?.success) {
      const todayM = getTodayMission();
      const missionTime = state.mission.time || '09:00';
      addMsg('sis', `좋은 아침! 🌿\n오늘의 미션: ${todayM.desc}\n💡 ${todayM.hint}\n⏰ 목표 ${missionTime}까지 파이팅! 🧚`);
    }
  }
  renderMessages();
  updateStatusBar();
})();
